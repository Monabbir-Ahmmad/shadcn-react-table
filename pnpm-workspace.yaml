packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  sharp: true
  unrs-resolver: true
  msw: false
  esbuild: false
  core-js: false

# Security floors for indirect dependencies (from `pnpm audit`): each is the
# first patched release, inside the range its dependents already allow.
overrides:
  vite@8: ^8.1.6
  undici@7: ^7.30.1
  nanoid@3: ^3.3.18
  source-map-js: ^1.2.2
  postcss: ^8.5.23
  browserslist: ^4.28.7
  baseline-browser-mapping: ^2.11.0
